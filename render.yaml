services:
  - type: web
    name: hrconnect
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 3600
      - key: JWT_REFRESH_EXPIRE
        value: 604800
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: ""
