services:
  - type: web
    name: hrconnect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && cd ../frontend && npm install && VITE_API_URL=https://hrconnect-backend-3xx2.onrender.com/api npm run build && cp -r dist ../backend/public
    startCommand: node server.js
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 3600
      - key: JWT_REFRESH_EXPIRE
        value: 604800
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
