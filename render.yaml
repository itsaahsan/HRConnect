services:
  - type: web
    name: hrconnect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 3600
      - key: JWT_REFRESH_EXPIRE
        value: 604800
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://hrconnect.onrender.com

  - type: static
    name: hrconnect-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hrconnect-backend.onrender.com/api
