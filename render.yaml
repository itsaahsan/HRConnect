services:
  - type: web
    name: hrconnect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_MeKFsZtXk42d@ep-broad-meadow-atfwrzki-pooler.c-9.us-east-1.aws.neon.tech/neondb
      - key: JWT_SECRET
        value: hrconnect_jwt_secret_2024_production_key
      - key: JWT_REFRESH_SECRET
        value: hrconnect_refresh_secret_2024_production_key
      - key: JWT_EXPIRE
        value: 3600
      - key: JWT_REFRESH_EXPIRE
        value: 604800
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://hrconnect.onrender.com

  - type: static
    name: hrconnect
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hrconnect-backend.onrender.com/api
